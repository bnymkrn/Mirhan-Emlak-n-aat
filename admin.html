<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirhan Emlak - Premium Yönetim Paneli</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= DARK THEME DEĞİŞKENLERİ ================= */
        :root {
            --sidebar-width: 260px;
            --bg-dark: #121212; 
            --bg-darker: #0a0a0a; 
            --bg-card: #1E1E1E; 
            --accent: #F5A623; 
            --accent-hover: #D08B1B;
            --text-light: #E0E0E0; 
            --text-muted: #A0A0A0; 
            --border-color: #333333;
            
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.5);
            --shadow-neon: 0 0 15px rgba(245, 166, 35, 0.3); 
            --transition: all 0.3s ease;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background-color: var(--bg-dark); color: var(--text-light); }
        h1, h2, h3, h4, th, .btn-primary { font-family: 'Urbanist', sans-serif; }

        /* --- GİRİŞ EKRANI STİLLERİ --- */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1E1E1E 0%, #0a0a0a 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; max-width: 400px; text-align: center; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .login-box h2 { color: #fff; margin-top: 0; margin-bottom: 25px; font-weight: 800; letter-spacing: 1px; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: var(--bg-dark); color: #fff; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 1rem; font-family: 'Poppins', sans-serif; transition: var(--transition); }
        .login-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(245, 166, 35, 0.3); }
        .login-box button { width: 100%; padding: 15px; background: var(--accent); color: #121212; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: 700; transition: var(--transition); font-family: 'Urbanist', sans-serif; }
        .login-box button:hover { background: var(--accent-hover); box-shadow: var(--shadow-neon); transform: translateY(-2px); }

        /* --- DASHBOARD STİLLERİ --- */
        #dashboardContent { display: none; display: flex; }
        .sidebar { width: var(--sidebar-width); height: 100vh; background: var(--bg-darker); border-right: 1px solid var(--border-color); position: fixed; padding-top: 20px; }
        .sidebar-header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-logo { height: 50px; filter: drop-shadow(0 0 5px rgba(245, 166, 35, 0.2)); transition: 0.3s; }
        .sidebar-logo:hover { transform: scale(1.05); }
        .sidebar-menu { list-style: none; padding: 20px 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: var(--text-muted); text-decoration: none; transition: var(--transition); cursor: pointer; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.1rem; }
        .sidebar-menu li a:hover { color: var(--accent); background: rgba(255,255,255,0.02); }
        .sidebar-menu li a.active { background: rgba(245, 166, 35, 0.1); color: var(--accent); border-right: 4px solid var(--accent); }

        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 40px; box-sizing: border-box; }
        header h1 { color: #fff; margin: 0; font-weight: 700; }
        .btn-primary { background: var(--accent); color: #121212; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-neon); transform: translateY(-2px); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); display: flex; align-items: center; justify-content: space-between; transition: var(--transition); }
        .stat-card:hover { border-color: rgba(245, 166, 35, 0.3); box-shadow: var(--shadow-neon); transform: translateY(-3px); }
        .stat-card h3 { color: #fff; font-size: 2rem; margin: 0 0 5px 0; }
        .stat-card p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }
        .stat-card i { font-size: 3rem; color: var(--accent); opacity: 0.8; }

        .data-table-container { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); overflow-x: auto; }
        .data-table-container h3 { color: #fff; margin-top: 0; margin-bottom: 20px; font-size: 1.3rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(0,0,0,0.2); color: var(--accent); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; background: rgba(245, 166, 35, 0.1); color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }
        .action-btn { border: none; background: rgba(255,255,255,0.05); cursor: pointer; color: var(--text-light); width: 35px; height: 35px; border-radius: 6px; font-size: 1rem; transition: var(--transition); margin-right: 8px; display: inline-flex; align-items: center; justify-content: center; }
        .action-btn.edit:hover { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .action-btn.delete:hover { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-menu span, .sidebar-header img, .sidebar-header p { display: none; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); padding: 20px; }
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
        }

        /* --- MODAL (İLAN EKLEME/DÜZENLEME) --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--bg-card); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-neon); width: 90%; max-width: 650px; position: relative; animation: slideIn 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; right: 25px; top: 25px; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); transition: var(--transition); }
        .close-btn:hover { color: var(--accent); transform: rotate(90deg); }
        .modal-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .modal-form .full-width { grid-column: span 2; }
        .modal-form input, .modal-form select, .modal-form textarea { width: 100%; padding: 12px 15px; background: var(--bg-dark); color: #fff; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: var(--transition); }
        .modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(245, 166, 35, 0.2); }
        .save-btn { grid-column: span 2; background: var(--accent); color: #121212; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: 'Urbanist', sans-serif; font-size: 1.1rem; margin-top: 10px; transition: var(--transition); }
        .save-btn:hover { background: var(--accent-hover); box-shadow: var(--shadow-neon); transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <i class="fas fa-shield-alt" style="font-size: 3.5rem; color: var(--accent); margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(245,166,35,0.4));"></i>
            <h2>Yönetici Girişi</h2>
            <form id="loginForm">
                <input type="email" id="kullaniciAdi" placeholder="E-posta Adresi" required>
                <input type="password" id="sifre" placeholder="Şifre" required>
                <button type="submit">Sisteme Gir</button>
            </form>
        </div>
    </div>

    <div id="dashboardContent" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header" style="padding-top: 15px;">
                <a href="index.html" style="text-decoration: none;">
                    <img src="resimler/logo.png" alt="Mirhan Emlak Logosu" class="sidebar-logo" onerror="this.style.display='none'">
                </a>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;">Premium Yönetim</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="fas fa-layer-group"></i> <span>İlan Yönetimi</span></a></li>
                <li><a onclick="cikisYap()"><i class="fas fa-sign-out-alt"></i> <span>Güvenli Çıkış</span></a></li>
            </ul>
        </div>

        <div class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;">
                <h1>Hoş Geldiniz, <span style="color: var(--accent);">Sebahattin Bey</span></h1>
                <button onclick="yeniIlanAc()" class="btn-primary"><i class="fas fa-plus"></i> Yeni İlan Ekle</button>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <div>
                        <h3 id="aktifIlanSayisi">0</h3> 
                        <p>Yayındaki İlan Sayısı</p>
                    </div>
                    <i class="fas fa-chart-line"></i>
                </div>
            </div>

            <div class="data-table-container">
                <h3><i class="fas fa-list-ul" style="color: var(--accent); margin-right: 10px;"></i> Yayımlanmış İlanlar</h3>
                <table>
                    <thead>
                        <tr>
                            <th>İlan Başlığı</th>
                            <th>Konum</th>
                            <th>Mülk Tipi</th>
                            <th>Tarih</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="ilanModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modalKapat" onclick="modalKapat()">×</span>
            <h2 id="modalBaslik" style="margin-top: 0; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;"><i class="fas fa-plus-circle" style="color: var(--accent);"></i> Yeni İlan Ekle</h2>
            
            <form class="modal-form" id="ilanEklemeFormu">
                <input type="hidden" id="ilanId" value="">
                <input type="text" id="ilanBaslik" placeholder="İlan Başlığı (Örn: Lüks Deniz Manzaralı Daire)" required class="full-width">
                <select id="ilanTip" required>
                    <option value="" disabled selected hidden>İlan Durumu Seçin</option>
                    <option value="satilik">Satılık</option>
                    <option value="kiralik">Kiralık</option>
                </select>
                <input type="text" id="ilanKonum" placeholder="Konum (İl, İlçe, Mahalle)" required>
                <input type="number" id="ilanFiyat" placeholder="Fiyat (₺)" required>
                <input type="number" id="ilanMetrekare" placeholder="Brüt Metrekare" required>
                <input type="text" id="ilanOda" placeholder="Oda Sayısı (Örn: 3+1)" required>
                <input type="url" id="ilanSahibinden" placeholder="Sahibinden İlan Linki (İsteğe Bağlı)">
                
                <div class="full-width" style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 6px; border: 1px dashed var(--border-color);">
                    <label for="ilanResimler" style="font-size: 0.95rem; color: var(--text-light); margin-bottom:10px; display:block; font-weight: 500;"><i class="fas fa-cloud-upload-alt" style="color: var(--accent); margin-right: 5px;"></i> İlan Resimleri (Çoklu Seçim İçin CTRL/CMD Kullanın)</label>
                    <input type="file" id="ilanResimler" accept="image/*" multiple style="border: none; padding: 0; background: transparent;">
                </div>
                
                <div id="resimOnizleme" class="full-width" style="display: flex; gap: 10px; overflow-x: auto; margin-top: 5px; padding-bottom: 5px;"></div>
                <button type="submit" id="kaydetButonu" class="save-btn full-width">İlanı Yayımla</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // KENDİ FIREBASE BİLGİLERİN
        const firebaseConfig = {
            apiKey: "AIzaSyAaZSH9hk7UnQl9vgd8tMUQOKwn4ZkgiGc",
            authDomain: "mirhanemlak-8e1cc.firebaseapp.com",
            databaseURL: "https://mirhanemlak-8e1cc-default-rtdb.firebaseio.com",
            projectId: "mirhanemlak-8e1cc",
            storageBucket: "mirhanemlak-8e1cc.firebasestorage.app",
            messagingSenderId: "717428403347",
            appId: "1:717428403347:web:031d290fcda34f8bcd7166",
            measurementId: "G-0DZL6PE6X2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app); 

        // --- GÜVENLİ GİRİŞ KONTROLÜ ---
        const loginScreen = document.getElementById('loginScreen');
        const dashboardContent = document.getElementById('dashboardContent');
        const loginForm = document.getElementById('loginForm');

        // Oturum durumunu dinle
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                dashboardContent.style.display = 'flex';
            } else {
                loginScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
            }
        });

        // Giriş Yapma İşlemi
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('kullaniciAdi').value; 
            const password = document.getElementById('sifre').value;

            const btn = loginForm.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Kontrol Ediliyor... <i class="fas fa-spinner fa-spin"></i>';

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    btn.innerHTML = originalText;
                })
                .catch((error) => {
                    alert("Giriş Başarısız! Lütfen bilgilerinizi kontrol edin.\nHata: " + error.message);
                    btn.innerHTML = originalText;
                });
        });

        // Çıkış Yapma İşlemi
        window.cikisYap = function() {
            signOut(auth).then(() => {
                window.location.reload();
            });
        }

        // --- İLAN YÖNETİM MOTORU (FIREBASE) ---
        const ilanFormu = document.getElementById('ilanEklemeFormu'); 
        const ilanSayaci = document.getElementById("aktifIlanSayisi");
        const ilanTablosu = document.querySelector("table tbody");
        const modal = document.getElementById("ilanModal");

        window.aktifIlanlar = [];

        const ilanlarRef = ref(db, 'ilanlar/');
        onValue(ilanlarRef, (snapshot) => {
            const data = snapshot.val();
            window.aktifIlanlar = data ? Object.values(data) : [];
            window.aktifIlanlar.sort((a, b) => b.id - a.id); 
            tabloyuGuncelle();
        });

        function tabloyuGuncelle() {
            if(ilanSayaci) ilanSayaci.innerText = window.aktifIlanlar.length;
            
            ilanTablosu.innerHTML = window.aktifIlanlar.map(ilan => `
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            ${ilan.resimler && ilan.resimler.length > 0 
                                ? `<div style="position: relative;">
                                    <img src="${ilan.resimler[0]}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #333;">
                                    <span style="position: absolute; bottom: -5px; right: -5px; font-size: 0.65rem; background: var(--accent); color: #000; padding: 2px 5px; border-radius: 10px; font-weight: bold;">+${ilan.resimler.length - 1}</span>
                                   </div>` 
                                : `<div style="width: 45px; height: 45px; background: #121212; border: 1px dashed #333; border-radius: 6px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-image" style="color: #555;"></i></div>`}
                            <span style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; font-weight: 500; color: #fff;">${ilan.baslik}</span>
                        </div>
                    </td>
                    <td><i class="fas fa-map-marker-alt" style="color: #555; margin-right: 5px;"></i> ${ilan.konum || '-'}</td>
                    <td>${ilan.tip ? ilan.tip.toUpperCase() : '-'}</td>
                    <td>${ilan.tarih}</td>
                    <td><span class="status-badge">Yayında</span></td>
                    <td>
                        <button class="action-btn edit" onclick="ilanDuzenle(${ilan.id})" title="Düzenle"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="ilanSil(${ilan.id})" title="Sil"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function veritabaninaKaydet(ilanlarDizisi) {
            const dataObj = {};
            ilanlarDizisi.forEach(ilan => { dataObj[ilan.id] = ilan; });
            
            set(ref(db, 'ilanlar/'), dataObj)
            .then(() => { modalKapat(); })
            .catch((error) => { alert("Kaydedilirken hata oluştu: " + error); });
        }

        window.yeniIlanAc = function() {
            ilanFormu.reset();
            document.getElementById('ilanId').value = ""; 
            document.getElementById('resimOnizleme').innerHTML = "";
            document.getElementById('modalBaslik').innerHTML = '<i class="fas fa-plus-circle" style="color: var(--accent);"></i> Yeni İlan Ekle';
            document.getElementById('kaydetButonu').innerHTML = 'İlanı Yayımla <i class="fas fa-check"></i>';
            modal.style.display = 'flex';
        }

        window.ilanDuzenle = function(id) {
            const ilan = window.aktifIlanlar.find(i => i.id === id);
            if(ilan) {
                document.getElementById('ilanId').value = ilan.id; 
                document.getElementById('ilanBaslik').value = ilan.baslik;
                document.getElementById('ilanTip').value = ilan.tip;
                document.getElementById('ilanKonum').value = ilan.konum;
                document.getElementById('ilanFiyat').value = ilan.fiyat;
                document.getElementById('ilanMetrekare').value = ilan.metrekare;
                document.getElementById('ilanOda').value = ilan.oda;
                document.getElementById('ilanSahibinden').value = ilan.sahibindenLink || ''; 

                const onizleme = document.getElementById('resimOnizleme');
                onizleme.innerHTML = "";
                if(ilan.resimler && ilan.resimler.length > 0) {
                    ilan.resimler.forEach(resim => {
                        const img = document.createElement('img');
                        img.src = resim;
                        img.style.height = "70px"; img.style.width = "90px"; img.style.objectFit = "cover";
                        img.style.borderRadius = "6px"; img.style.border = "1px solid #333";
                        onizleme.appendChild(img);
                    });
                }
                document.getElementById('modalBaslik').innerHTML = '<i class="fas fa-edit" style="color: var(--accent);"></i> İlanı Güncelle';
                document.getElementById('kaydetButonu').innerHTML = 'Değişiklikleri Kaydet <i class="fas fa-save"></i>';
                modal.style.display = 'flex';
            }
        }

        window.modalKapat = function() { modal.style.display = 'none'; }

        const resimInput = document.getElementById('ilanResimler');
        const onizlemeKutusu = document.getElementById('resimOnizleme');

        if (resimInput) {
            resimInput.addEventListener('change', function() {
                if(onizlemeKutusu) onizlemeKutusu.innerHTML = ""; 
                for (let file of this.files) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.style.height = "70px"; img.style.width = "90px"; img.style.objectFit = "cover";
                        img.style.borderRadius = "6px"; img.style.border = "1px solid #333";
                        if(onizlemeKutusu) onizlemeKutusu.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        function resmiKucultVeCevir(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    }
                };
                reader.onerror = error => reject(error);
            });
        }

        if (ilanFormu) {
            ilanFormu.onsubmit = async function(e) {
                e.preventDefault();
                document.getElementById('kaydetButonu').innerHTML = 'Yükleniyor... <i class="fas fa-spinner fa-spin"></i>';
                
                const fileInput = document.getElementById('ilanResimler');
                const resimlerBase64 = [];
                
                if (fileInput && fileInput.files.length > 0) {
                    for (let file of fileInput.files) {
                        const base64 = await resmiKucultVeCevir(file);
                        resimlerBase64.push(base64);
                    }
                }

                let ilanlar = [...window.aktifIlanlar]; 
                const editId = document.getElementById('ilanId').value;

                if (editId) {
                    const index = ilanlar.findIndex(i => i.id == editId);
                    if (index !== -1) {
                        ilanlar[index].baslik = document.getElementById('ilanBaslik').value;
                        ilanlar[index].tip = document.getElementById('ilanTip').value;
                        ilanlar[index].konum = document.getElementById('ilanKonum').value;
                        ilanlar[index].fiyat = document.getElementById('ilanFiyat').value;
                        ilanlar[index].metrekare = document.getElementById('ilanMetrekare').value;
                        ilanlar[index].oda = document.getElementById('ilanOda').value;
                        ilanlar[index].sahibindenLink = document.getElementById('ilanSahibinden').value; 
                        if (resimlerBase64.length > 0) { ilanlar[index].resimler = resimlerBase64; }
                    }
                    alert("✔️ İlan başarıyla güncellendi!");
                } else {
                    const yeniIlan = {
                        id: Date.now(),
                        baslik: document.getElementById('ilanBaslik').value,
                        tip: document.getElementById('ilanTip').value,
                        konum: document.getElementById('ilanKonum').value,
                        fiyat: document.getElementById('ilanFiyat').value,
                        metrekare: document.getElementById('ilanMetrekare').value,
                        oda: document.getElementById('ilanOda').value,
                        sahibindenLink: document.getElementById('ilanSahibinden').value, 
                        resimler: resimlerBase64,
                        tarih: new Date().toLocaleDateString('tr-TR')
                    };
                    ilanlar.unshift(yeniIlan);
                    alert("✔️ Yeni ilan başarıyla kaydedildi!");
                }
                
                veritabaninaKaydet(ilanlar);
            };
        }

        window.ilanSil = function(id) {
            if(confirm("Bu ilanı silmek istediğinize emin misiniz?")) {
                let ilanlar = window.aktifIlanlar.filter(i => i.id !== id);
                veritabaninaKaydet(ilanlar);
            }
        }
    </script>
</body>
</html>
