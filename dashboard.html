<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirhan Emlak - Yönetim Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #d32f2f;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-color);
        }

        /* Sidebar Stil */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: #2c3e50;
            color: white;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu li a {
            display: block;
            padding: 15px 25px;
            color: #bdc3c7;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: var(--primary-color);
            color: white;
        }

        /* Ana İçerik Alanı */
        .main-content {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            padding: 30px;
        }

        /* Özet Kartları */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card i {
            font-size: 2.5rem;
            color: var(--primary-color);
            opacity: 0.8;
        }

        /* Tablo Alanı */
        .data-table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .action-btn {
            border: none;
            background: none;
            cursor: pointer;
            color: #555;
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .action-btn.edit:hover { color: #1976d2; }
        .action-btn.delete:hover { color: var(--primary-color); }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-menu span, .sidebar-header h2 { display: none; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); }
        }

        /* Modal Arkaplanı */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        /* Modal Kutusu */
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }

        .modal-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-form .full-width { grid-column: span 2; }

        .modal-form input, .modal-form select, .modal-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .save-btn {
            grid-column: span 2;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>MİRHAN</h2>
            <p style="font-size: 0.8rem; color: #bdc3c7;">Yönetim Paneli</p>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fas fa-home"></i> <span>İlan Yönetimi</span></a></li>
            <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Çıkış Yap</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>Hoş Geldin, Sebahattin Bey</h1>
            
            <div style="display: flex; align-items: center; gap: 20px;">
                <button onclick="yeniIlanAc()" style="background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-plus"></i> Yeni İlan Ekle
                </button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div>
                    <h3 id="aktifIlanSayisi">0</h3> <p>Aktif İlan</p>
                </div>
                <i class="fas fa-building"></i>
            </div>
        </div>

        <div class="data-table-container">
            <h3>Yayımlanmış İlanlar</h3>
            <table>
                <thead>
                    <tr>
                        <th>İlan Başlığı</th>
                        <th>Konum</th>
                        <th>Mülk Tipi</th>
                        <th>Tarih</th>
                        <th>Durum</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <div id="ilanModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modalKapat" onclick="modalKapat()">&times;</span>
            <h2 id="modalBaslik" style="margin-top: 0; color: #333;"><i class="fas fa-plus-circle"></i> Yeni İlan Ekle</h2>
            <hr style="margin-bottom: 20px; opacity: 0.2;">
            
            <form class="modal-form" id="ilanEklemeFormu">
                <input type="hidden" id="ilanId" value="">

                <input type="text" id="ilanBaslik" placeholder="İlan Başlığı" required class="full-width">
                
                <select id="ilanTip" required>
                    <option value="satilik">Satılık</option>
                    <option value="kiralik">Kiralık</option>
                </select>
                <input type="text" id="ilanKonum" placeholder="Konum (İl, İlçe, Mahalle)" required>
                
                <input type="number" id="ilanFiyat" placeholder="Fiyat (₺)" required>
                <input type="number" id="ilanMetrekare" placeholder="Metrekare" required>
                <input type="text" id="ilanOda" placeholder="Oda Sayısı" required class="full-width">
                
                <div class="full-width">
                    <label for="ilanResimler" style="font-size: 0.9rem; color: #555; margin-bottom:5px; display:block;">İlan Resimleri (Yeni resim seçilmezse eskiler kalır)</label>
                    <input type="file" id="ilanResimler" accept="image/*" multiple>
                </div>
                
                <div id="resimOnizleme" class="full-width" style="display: flex; gap: 10px; overflow-x: auto; margin-top: 10px;"></div>

                <button type="submit" id="kaydetButonu" class="save-btn full-width">İlanı Yayınla</button>
            </form>
        </div>
    </div>

    <script>
        const ilanFormu = document.getElementById('ilanEklemeFormu'); 
const ilanSayaci = document.getElementById("aktifIlanSayisi");
const ilanTablosu = document.querySelector("table tbody");
const modal = document.getElementById("ilanModal");

function tabloyuGuncelle() {
    const ilanlar = JSON.parse(localStorage.getItem('adminIlanlar')) || [];
    if(ilanSayaci) ilanSayaci.innerText = ilanlar.length;
    
    ilanTablosu.innerHTML = ilanlar.map(ilan => `
        <tr>
            <td>
                <div style="display: flex; align-items: center; gap: 10px;">
                    ${ilan.resimler && ilan.resimler.length > 0 
                        ? `<img src="${ilan.resimler[0]}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 5px;">
                           <span style="font-size: 0.7rem; background: #ddd; padding: 2px 5px; border-radius: 10px;">+${ilan.resimler.length - 1}</span>` 
                        : `<div style="width: 40px; height: 40px; background: #eee; border-radius: 5px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-image" style="color: #ccc;"></i></div>`}
                    <span style="max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block;">${ilan.baslik}</span>
                </div>
            </td>
            <td>${ilan.konum || '-'}</td>
            <td>${ilan.tip ? ilan.tip.toUpperCase() : '-'}</td>
            <td>${ilan.tarih}</td>
            <td><span class="status-badge" style="background:#e3f2fd; color:#1565c0;">Yayında</span></td>
            <td>
                <button class="action-btn edit" onclick="ilanDuzenle(${ilan.id})" title="Düzenle"><i class="fas fa-edit"></i></button>
                <button class="action-btn delete" onclick="ilanSil(${ilan.id})" title="Sil"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

window.yeniIlanAc = function() {
    ilanFormu.reset();
    document.getElementById('ilanId').value = ""; 
    document.getElementById('resimOnizleme').innerHTML = "";
    document.getElementById('modalBaslik').innerHTML = '<i class="fas fa-plus-circle"></i> Yeni İlan Ekle';
    document.getElementById('kaydetButonu').innerText = 'İlanı Yayınla';
    modal.style.display = 'flex';
}

window.ilanDuzenle = function(id) {
    const ilanlar = JSON.parse(localStorage.getItem('adminIlanlar')) || [];
    const ilan = ilanlar.find(i => i.id === id);
    
    if(ilan) {
        document.getElementById('ilanId').value = ilan.id; 
        document.getElementById('ilanBaslik').value = ilan.baslik;
        document.getElementById('ilanTip').value = ilan.tip;
        document.getElementById('ilanKonum').value = ilan.konum;
        document.getElementById('ilanFiyat').value = ilan.fiyat;
        document.getElementById('ilanMetrekare').value = ilan.metrekare;
        document.getElementById('ilanOda').value = ilan.oda;

        const onizleme = document.getElementById('resimOnizleme');
        onizleme.innerHTML = "";
        if(ilan.resimler && ilan.resimler.length > 0) {
            ilan.resimler.forEach(resim => {
                const img = document.createElement('img');
                img.src = resim;
                img.style.height = "60px";
                img.style.width = "80px";
                img.style.objectFit = "cover";
                img.style.borderRadius = "5px";
                onizleme.appendChild(img);
            });
        }

        document.getElementById('modalBaslik').innerHTML = '<i class="fas fa-edit"></i> İlanı Güncelle';
        document.getElementById('kaydetButonu').innerText = 'Değişiklikleri Kaydet';
        modal.style.display = 'flex';
    }
}

window.modalKapat = function() {
    modal.style.display = 'none';
}

const resimInput = document.getElementById('ilanResimler');
const onizlemeKutusu = document.getElementById('resimOnizleme');

if (resimInput) {
    resimInput.addEventListener('change', function() {
        if(onizlemeKutusu) onizlemeKutusu.innerHTML = ""; 
        for (let file of this.files) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.createElement('img');
                img.src = event.target.result;
                img.style.height = "60px";
                img.style.width = "80px";
                img.style.objectFit = "cover";
                img.style.borderRadius = "5px";
                if(onizlemeKutusu) onizlemeKutusu.appendChild(img);
            }
            reader.readAsDataURL(file);
        }
    });
}

// YENİ: Boyut düşürücü ve sıkıştırıcı fonksiyon
function resmiKucultVeCevir(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; // Maksimum genişlik
                const MAX_HEIGHT = 800; // Maksimum yükseklik
                let width = img.width;
                let height = img.height;

                // En boy oranını koruyarak yeniden boyutlandır
                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // JPEG formatında ve %70 kaliteyle kaydet (Boyutu ciddi şekilde düşürür)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                resolve(dataUrl);
            }
        };
        reader.onerror = error => reject(error);
    });
}

if (ilanFormu) {
    ilanFormu.onsubmit = async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('ilanResimler');
        const resimlerBase64 = [];
        
        // YENİ: Seçilen her resmi önce sıkıştır, sonra diziye ekle
        if (fileInput && fileInput.files.length > 0) {
            for (let file of fileInput.files) {
                const base64 = await resmiKucultVeCevir(file);
                resimlerBase64.push(base64);
            }
        }

        let ilanlar = JSON.parse(localStorage.getItem('adminIlanlar')) || [];
        const editId = document.getElementById('ilanId').value;

        if (editId) {
            const index = ilanlar.findIndex(i => i.id == editId);
            if (index !== -1) {
                ilanlar[index].baslik = document.getElementById('ilanBaslik').value;
                ilanlar[index].tip = document.getElementById('ilanTip').value;
                ilanlar[index].konum = document.getElementById('ilanKonum').value;
                ilanlar[index].fiyat = document.getElementById('ilanFiyat').value;
                ilanlar[index].metrekare = document.getElementById('ilanMetrekare').value;
                ilanlar[index].oda = document.getElementById('ilanOda').value;
                
                if (resimlerBase64.length > 0) {
                    ilanlar[index].resimler = resimlerBase64;
                }
            }
            alert("✔️ İlan başarıyla güncellendi!");
        } else {
            const yeniIlan = {
                id: Date.now(),
                baslik: document.getElementById('ilanBaslik').value,
                tip: document.getElementById('ilanTip').value,
                konum: document.getElementById('ilanKonum').value,
                fiyat: document.getElementById('ilanFiyat').value,
                metrekare: document.getElementById('ilanMetrekare').value,
                oda: document.getElementById('ilanOda').value,
                resimler: resimlerBase64,
                tarih: new Date().toLocaleDateString('tr-TR')
            };
            ilanlar.unshift(yeniIlan);
            alert("✔️ Yeni ilan başarıyla kaydedildi!");
        }
        
        try {
            localStorage.setItem('adminIlanlar', JSON.stringify(ilanlar));
            tabloyuGuncelle();
            modalKapat();
        } catch (error) {
            alert("Hata: Resim boyutları çok büyük. Tarayıcı hafızası doldu!");
        }
    };
}

window.ilanSil = function(id) {
    if(confirm("Bu ilanı silmek istediğinize emin misiniz?")) {
        let ilanlar = JSON.parse(localStorage.getItem('adminIlanlar')) || [];
        ilanlar = ilanlar.filter(i => i.id !== id);
        localStorage.setItem('adminIlanlar', JSON.stringify(ilanlar));
        tabloyuGuncelle();
    }
}

tabloyuGuncelle();
    </script>
</body>
</html>
